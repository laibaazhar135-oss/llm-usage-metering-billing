services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devpassword123
      POSTGRES_DB: billingdb
    ports:
      - "5432:5432"
    volumes:
      - billing-pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  billing-pgdata: